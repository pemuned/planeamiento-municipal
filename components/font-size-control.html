<div class="container font-size-toolbar">

    <div class="font-size-control"
         role="group"
         aria-label="Cambiar tamaño del texto">

        <span class="font-size-label">
            Tamaño de texto
        </span>

        <button type="button"
                class="font-size-btn"
                data-font-size="normal"
                aria-label="Texto normal"
                aria-pressed="true">A</button>

        <button type="button"
                class="font-size-btn"
                data-font-size="medium"
                aria-label="Texto mediano"
                aria-pressed="false">A</button>

        <button type="button"
                class="font-size-btn"
                data-font-size="large"
                aria-label="Texto grande"
                aria-pressed="false">A</button>

    </div>

</div>
