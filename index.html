<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caja de Herramientas de la Planificación Municipal</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/styles.css">
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- HEADER -->
  <div data-include="components/header.html"></div>
  <main class="container-fluid main-menu">

    <section class="menu-panel mx-auto" aria-label="Menú principal">
        <div class="menu-grid">

            <!-- FILA 1 -->
            <div class="row g-0 gx-2 gy-3 mt-0">
                <div class="col-6 d-flex justify-content-center">
                    <a href="pages/plan-desarrollo.html" class="menu-btn">
                        <picture>
                            <source media="(max-width: 767.98px)"
                                    srcset="assets/img/menu/btn_PD_movil.png">

                            <img src="assets/img/menu/btn_PD_desk.png"
                                class="img-fluid"
                                alt="Plan de Desarrollo">
                        </picture>
                    </a>
                </div>

                <div class="col-6 d-flex justify-content-center">
                    <picture>
                        <source media="(max-width: 767.98px)"
                                srcset="assets/img/menu/decorativos/img_1_movil.png">

                        <img src="assets/img/menu/decorativos/img_1_2.png"
                            class="img-fluid menu-decor"
                            alt="">
                    </picture>
                </div>
            </div>

            <!-- FILA 2 -->
            <div class="row g-0 gx-2 gy-3 mt-0">

                <div class="col-6 d-flex justify-content-center">
                    <a href="pages/introduccion.html" class="menu-btn">
                        <picture>
                            <source media="(max-width: 767.98px)"
                                    srcset="assets/img/menu/btn_Intro_movil.png">

                            <img src="assets/img/menu/btn_Intro_desk.png"
                                class="img-fluid"
                                alt="Introducción">
                        </picture>
                    </a>
                </div>

                <div class="col-6">
                    <div class="row g-0 gx-2 h-100">

                        <div class="col-12 d-flex justify-content-center align-self-start">
                            <a href="pages/herramientas.html" class="menu-btn">
                                <picture>
                                    <source media="(max-width: 767.98px)"
                                            srcset="assets/img/menu/btn_Herra_movil.png">

                                    <img src="assets/img/menu/btn_Herra_desk.png"
                                        class="img-fluid"
                                        alt="Herramientas">
                                </picture>
                            </a>
                        </div>

                        <div class="col-12 d-flex justify-content-center align-self-end">
                            <picture>
                                <source media="(max-width: 767.98px)"
                                        srcset="assets/img/menu/decorativos/img_2_movil.png">

                                <img src="assets/img/menu/decorativos/img_3_4.png"
                                    class="img-fluid menu-decor"
                                    alt="">
                            </picture>
                        </div>

                    </div>
                </div>

            </div>

            <!-- FILA 3 -->
            <div class="row g-0 gx-2 gy-3 mt-0 mb-3">

                <div class="col-6 d-flex justify-content-center">
                    <a href="pages/referencias.html" class="menu-btn">
                        <picture>
                            <source media="(max-width: 767.98px)"
                                    srcset="assets/img/menu/btn_Refe_movil.png">

                            <img src="assets/img/menu/btn_referencias_desk.png"
                                class="img-fluid"
                                alt="Referencias">
                        </picture>
                    </a>
                </div>

                <div class="col-6 d-flex justify-content-center">
                    <a href="pages/casos.html" class="menu-btn">
                        <picture>
                            <source media="(max-width: 767.98px)"
                                    srcset="assets/img/menu/btn_casos_movil.png">

                            <img src="assets/img/menu/btn_casos_desk.png"
                                class="img-fluid"
                                alt="Casos">
                        </picture>
                    </a>
                </div>

            </div>

        </div>
    </section>

</main>
  <!-- FOOTER -->
  <div data-include="components/footer.html"></div>

  <!-- Bootstrap 5.3 Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom JS -->
  <script src="assets/js/app.js"></script>
</body>
</html>
